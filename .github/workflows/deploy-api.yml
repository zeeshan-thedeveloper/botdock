name: Deploy API

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/zeeshan-thedeveloper/botdock-api
  DEPLOY_HOST: 134.209.221.190
  DEPLOY_USER: zeesh

jobs:
  deploy:
    name: Build & Deploy API
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync compose file to droplet
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p ~/apps/botdock'
          scp -i ~/.ssh/deploy_key docker-compose.api.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:apps/botdock/"

      - name: Deploy to droplet
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            cd ~/apps/botdock
            test -f .env || { echo "Missing ~/apps/botdock/.env on the droplet"; exit 1; }
            docker compose -f docker-compose.api.prod.yml pull
            docker compose -f docker-compose.api.prod.yml up -d --force-recreate
            docker image prune -f
          '

      - name: Verify health
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" '
            for attempt in $(seq 1 12); do
              if curl -sf http://127.0.0.1:4000/health >/dev/null; then
                echo "API healthy"
                exit 0
              fi
              echo "Waiting for health... attempt $attempt/12"
              sleep 5
            done
            echo "Health check failed"
            docker compose -f ~/apps/botdock/docker-compose.api.prod.yml logs --tail=80 api
            exit 1
          '
